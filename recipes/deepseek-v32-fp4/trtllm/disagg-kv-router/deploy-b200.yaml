#
# DeepSeek-V3 / V3.2 NVFP4 disaggregated (KV-aware routing) on HGX B200 with InfiniBand.
#
# Target workload:
#   - ISL ~8000, OSL ~300  (Ctx:Gen ~27; with 67% prefix cache hit -> ~9)
#   - Prefix cache hit rate ~67% (KV-aware routing does the work)
#   - TTFT p99 <= 2.5 s
#   - ITL unconstrained (>=5 tok/s per user is acceptable)
#
# This workload is strongly prefill-heavy. Compute demand ratio
# prefill:decode is ~7:1 after accounting for prefix cache hits, so the
# topology is inverted vs. the GB200 recipe: MORE prefill than decode.
#
# Target hardware (high-throughput):
#   - 3x HGX B200 nodes (8x B200 180GB per node) = 24 GPUs
#   - 2 nodes for prefill (2 replicas x TP=8, EP=8)  -- capacity bottleneck
#   - 1 node for decode  (TP=8, EP=8, attention-DP)  -- 1k-batch on single node
#   - InfiniBand between nodes (RoCEv2 also OK with NCCL_IB_GID_INDEX=3)
#
# If p99 TTFT drifts above budget under peak load, add a 3rd prefill
# replica (4th node) before scaling decode.
#
# Differences vs. the GB200 NVL72 sibling config (deploy.yaml):
#   - arch: arm64 -> removed (B200 HGX is x86_64)
#   - ComputeDomain / compute-domain-channel resourceClaim -> removed
#   - NCCL_MNNVL_ENABLE / NCCL_CUMEM_ENABLE / NCCL_NVLS_ENABLE -> removed (no MNNVL on HGX)
#   - UCX_CUDA_IPC_ENABLE_MNNVL / TRTLLM_FORCE_COMM_METHOD=NVLINK_TWO_SIDED -> removed
#   - allreduce_strategy: MNNVL -> removed from decode config (use default)
#   - Per-node GPU limit: 4 -> 8
#   - Decode scaled to TP=16 / EP=16 across 2 nodes for WideEP over IB
#   - rdma/ib resource + IPC_LOCK capability added for IB KV-cache transport (UCX)
#
# Before applying: set NCCL_IB_HCA to your HCA names (e.g. mlx5_0,mlx5_1,...mlx5_7)
# and NCCL_SOCKET_IFNAME / GLOO_SOCKET_IFNAME to your pod management interface.

apiVersion: nvidia.com/v1alpha1
kind: DynamoGraphDeployment
metadata:
  name: disagg-kv-dsv32-nvfp4-b200
spec:
  services:
    Frontend:
      componentType: frontend
      extraPodSpec:
        containers: null
        mainContainer:
          command:
            - python3
          args:
            - -m
            - dynamo.frontend
            - --router-mode
            - kv
            - --router-reset-states
            - --request-plane
            - nats
          env:
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
          image: nvcr.io/nvidia/ai-dynamo/tensorrtllm-runtime:1.0.0
          name: ""
          resources: {}
      replicas: 1
    prefill:
      componentType: worker
      subComponentType: prefill
      envFromSecret: hf-token-secret
      extraPodSpec:
        containers: null
        mainContainer:
          args:
            - --model-path
            - nvidia/DeepSeek-V3.2-NVFP4
            - --served-model-name
            - nvidia/DeepSeek-V3.2-NVFP4
            - --extra-engine-args
            - /config/prefill.yaml
            - --disaggregation-mode
            - prefill
            - --publish-events-and-metrics
            - --request-plane
            - nats
            - --kv-block-size
            - "64"
          command:
            - python3
            - -m
            - dynamo.trtllm
          env:
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: HF_HOME
              value: /model-cache
            - name: TRITON_CACHE_DIR
              value: /model-cache/.triton-cache
            - name: NCCL_DEBUG
              value: INFO
            - name: NVIDIA_GDRCOPY
              value: "1"
            # InfiniBand/RoCE transport for NCCL + UCX KV transfer
            - name: NCCL_IB_HCA
              value: "mlx5"
            - name: NCCL_IB_GID_INDEX
              value: "3"
            - name: NCCL_IB_TIMEOUT
              value: "22"
            - name: NCCL_SOCKET_IFNAME
              value: eth0
            - name: GLOO_SOCKET_IFNAME
              value: eth0
            - name: UCX_TLS
              value: "rc,cuda_copy,cuda_ipc,gdr_copy"
            - name: UCX_NET_DEVICES
              value: "mlx5_0:1"
            - name: NCCL_STORE_TIMEOUT
              value: "7200"
            - name: TRTLLM_MOE_ENABLE_ALLTOALL_WITHOUT_ALLGATHER
              value: "1"
            - name: TRTLLM_ENABLE_PDL
              value: "1"
            - name: TRTLLM_SERVER_DISABLE_GC
              value: "1"
            - name: TRTLLM_WORKER_DISABLE_GC
              value: "1"
            - name: NCCL_GRAPH_MIXING_SUPPORT
              value: "0"
            - name: TLLM_LOG_LEVEL
              value: "INFO"
          image: nvcr.io/nvidia/ai-dynamo/tensorrtllm-runtime:1.0.0
          name: ""
          resources: {}
          securityContext:
            runAsUser: 0
            capabilities:
              add: ["IPC_LOCK"]
          startupProbe:
            failureThreshold: 60
            httpGet:
              path: /live
              port: 9090
            periodSeconds: 60
            timeoutSeconds: 5
          volumeMounts:
            - mountPath: /model-cache
              name: model-cache
            - mountPath: /config
              name: trtllm-config
              readOnly: true
            - mountPath: /dev/shm
              name: dshm
          workingDir: /workspace/
        volumes:
          - name: model-cache
            persistentVolumeClaim:
              claimName: model-cache
          - name: trtllm-config
            configMap:
              name: dsv32-trtllm-config-b200
          - name: dshm
            emptyDir:
              medium: Memory
              sizeLimit: 80Gi
      replicas: 2
      resources:
        limits:
          gpu: "8"
          rdma/ib: "8"
    dec:
      componentType: worker
      subComponentType: decode
      envFromSecret: hf-token-secret
      extraPodSpec:
        containers: null
        mainContainer:
          args:
            - --model-path
            - nvidia/DeepSeek-V3.2-NVFP4
            - --served-model-name
            - nvidia/DeepSeek-V3.2-NVFP4
            - --extra-engine-args
            - /config/decode.yaml
            - --disaggregation-mode
            - decode
            - --publish-events-and-metrics
            - --request-plane
            - nats
            - --kv-block-size
            - "64"
          command:
            - python3
            - -m
            - dynamo.trtllm
          env:
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: HF_HOME
              value: /model-cache
            - name: TRITON_CACHE_DIR
              value: /model-cache/.triton-cache
            - name: NCCL_DEBUG
              value: INFO
            - name: NVIDIA_GDRCOPY
              value: "1"
            # InfiniBand/RoCE transport for NCCL + UCX KV transfer + EP alltoall
            - name: NCCL_IB_HCA
              value: "mlx5"
            - name: NCCL_IB_GID_INDEX
              value: "3"
            - name: NCCL_IB_TIMEOUT
              value: "22"
            - name: NCCL_SOCKET_IFNAME
              value: eth0
            - name: GLOO_SOCKET_IFNAME
              value: eth0
            - name: UCX_TLS
              value: "rc,cuda_copy,cuda_ipc,gdr_copy"
            - name: UCX_NET_DEVICES
              value: "mlx5_0:1"
            - name: NCCL_STORE_TIMEOUT
              value: "7200"
            - name: TRTLLM_MOE_ENABLE_ALLTOALL_WITHOUT_ALLGATHER
              value: "1"
            - name: TRTLLM_ENABLE_PDL
              value: "1"
            - name: TRTLLM_SERVER_DISABLE_GC
              value: "1"
            - name: TRTLLM_WORKER_DISABLE_GC
              value: "1"
            - name: NCCL_GRAPH_MIXING_SUPPORT
              value: "0"
            - name: ENABLE_CONFIGURABLE_MOE
              value: "1"
            - name: TLLM_LOG_LEVEL
              value: "INFO"
          image: nvcr.io/nvidia/ai-dynamo/tensorrtllm-runtime:1.0.0
          name: ""
          resources: {}
          securityContext:
            runAsUser: 0
            capabilities:
              add: ["IPC_LOCK"]
          startupProbe:
            failureThreshold: 60
            httpGet:
              path: /live
              port: 9090
            periodSeconds: 60
            timeoutSeconds: 5
          volumeMounts:
            - mountPath: /model-cache
              name: model-cache
            - mountPath: /config
              name: trtllm-config
              readOnly: true
            - mountPath: /dev/shm
              name: dshm
          workingDir: /workspace/
        volumes:
          - name: model-cache
            persistentVolumeClaim:
              claimName: model-cache
          - name: trtllm-config
            configMap:
              name: dsv32-trtllm-config-b200
          - name: dshm
            emptyDir:
              medium: Memory
              sizeLimit: 80Gi
      replicas: 1
      resources:
        limits:
          gpu: "8"
          rdma/ib: "8"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dsv32-trtllm-config-b200
data:
  # SLA target for this config:
  #   TTFT p99 <= 2.5 s
  #   ITL unconstrained (decode TPS/user as low as ~5 tok/s is acceptable)
  # This is a throughput-heavy regime: pack as much concurrent decode as
  # possible, keep prefill lean to avoid queue tail on TTFT p99.
  prefill.yaml: |
    # Prefill: single HGX B200 node, TP=8, EP=8.
    # Keep batch SMALL (saturate GPU with min parallelism) so queue
    # depth is what it is -- this protects TTFT p99. Large max_num_tokens
    # lets a single long prompt finish in one iter. Enable chunked prefill
    # + block reuse for prefix cache hits.
    cache_transceiver_config:
      backend: UCX
      max_tokens_in_buffer: 120000
    max_num_tokens: 16384
    enable_chunked_prefill: true
    cuda_graph_config:
      max_batch_size: 8
      enable_padding: true
    disable_overlap_scheduler: true
    enable_attention_dp: true
    kv_cache_config:
      dtype: fp8
      enable_block_reuse: true
      free_gpu_memory_fraction: 0.90
      tokens_per_block: 64
    max_batch_size: 8
    max_seq_len: 121000
    moe_config:
      backend: TRTLLM
    moe_expert_parallel_size: 8
    print_iter_log: true
    tensor_parallel_size: 8
  decode.yaml: |
    # Decode: 1x HGX B200 node, TP=8, EP=8, attention-DP, MTP-3.
    #
    # With ISL 8k + OSL 300 the decode compute is small relative to
    # prefill; a single node with batch=1024 has plenty of headroom.
    # WideEP + multi-node dropped -- single-node avoids inter-node
    # alltoall entirely (NVSwitch-only MoE comms).
    #
    # Key decode throughput optimizations (ITL budget is loose):
    # - MTP (Multi-Token Prediction) with num_nextn_predict_layers=3:
    #   DeepSeek-V3 ships a built-in MTP module. MTP-Eagle reuses that
    #   single module 3x per step to speculate 3 draft tokens, verified
    #   in one main-model forward pass. Expected 1.6-2.3x decode
    #   throughput at ~85% acceptance on DS-V3 production workloads.
    # - stream_interval=20: scheduler sends a streamed token every 20
    #   iters (~0.6 s at typical decode rate). OK because ITL budget
    #   allows >=5 tok/s per user.
    # - max_batch_size=1024 with cuda-graph padding: cover the whole
    #   batch ladder so we never fall back to eager.
    # - KV fraction 0.85: leave headroom for MTP draft-KV + activation
    #   buffers. At 8x B200 180GB this still yields ~850 GB of KV pool.
    cache_transceiver_config:
      backend: UCX
      max_tokens_in_buffer: 120000
    max_num_tokens: 16384
    cuda_graph_config:
      max_batch_size: 1024
      enable_padding: true
      batch_sizes: [1, 2, 4, 8, 16, 32, 64, 128, 256, 384, 512, 768, 1024]
    enable_attention_dp: true
    kv_cache_config:
      dtype: fp8
      enable_block_reuse: false
      free_gpu_memory_fraction: 0.85
      tokens_per_block: 64
    max_batch_size: 1024
    max_seq_len: 121000
    moe_config:
      backend: TRTLLM
    moe_expert_parallel_size: 8
    num_postprocess_workers: 16
    print_iter_log: true
    speculative_config:
      decoding_type: MTP
      num_nextn_predict_layers: 3
    stream_interval: 20
    tensor_parallel_size: 8
