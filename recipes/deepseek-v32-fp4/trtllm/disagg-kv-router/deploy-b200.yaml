#
# DeepSeek-V3 / V3.2 NVFP4 disaggregated (KV-aware routing) on HGX B200 with InfiniBand.
#
# Target hardware (high-throughput):
#   - 3x HGX B200 nodes (8x B200 180GB per node) = 24 GPUs
#   - 1 node for prefill (TP=8, EP=8)
#   - 2 nodes for decode with WideEP (TP=16, EP=16, attention-DP)
#   - InfiniBand between nodes (RoCEv2 also OK with NCCL_IB_GID_INDEX=3)
#
# Differences vs. the GB200 NVL72 sibling config (deploy.yaml):
#   - arch: arm64 -> removed (B200 HGX is x86_64)
#   - ComputeDomain / compute-domain-channel resourceClaim -> removed
#   - NCCL_MNNVL_ENABLE / NCCL_CUMEM_ENABLE / NCCL_NVLS_ENABLE -> removed (no MNNVL on HGX)
#   - UCX_CUDA_IPC_ENABLE_MNNVL / TRTLLM_FORCE_COMM_METHOD=NVLINK_TWO_SIDED -> removed
#   - allreduce_strategy: MNNVL -> removed from decode config (use default)
#   - Per-node GPU limit: 4 -> 8
#   - Decode scaled to TP=16 / EP=16 across 2 nodes for WideEP over IB
#   - rdma/ib resource + IPC_LOCK capability added for IB KV-cache transport (UCX)
#
# Before applying: set NCCL_IB_HCA to your HCA names (e.g. mlx5_0,mlx5_1,...mlx5_7)
# and NCCL_SOCKET_IFNAME / GLOO_SOCKET_IFNAME to your pod management interface.

apiVersion: nvidia.com/v1alpha1
kind: DynamoGraphDeployment
metadata:
  name: disagg-kv-dsv32-nvfp4-b200
spec:
  services:
    Frontend:
      componentType: frontend
      extraPodSpec:
        containers: null
        mainContainer:
          command:
            - python3
          args:
            - -m
            - dynamo.frontend
            - --router-mode
            - kv
            - --router-reset-states
            - --request-plane
            - nats
          env:
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
          image: nvcr.io/nvidia/ai-dynamo/tensorrtllm-runtime:1.0.0
          name: ""
          resources: {}
      replicas: 1
    prefill:
      componentType: worker
      subComponentType: prefill
      envFromSecret: hf-token-secret
      extraPodSpec:
        containers: null
        mainContainer:
          args:
            - --model-path
            - nvidia/DeepSeek-V3.2-NVFP4
            - --served-model-name
            - nvidia/DeepSeek-V3.2-NVFP4
            - --extra-engine-args
            - /config/prefill.yaml
            - --disaggregation-mode
            - prefill
            - --publish-events-and-metrics
            - --request-plane
            - nats
            - --kv-block-size
            - "64"
          command:
            - python3
            - -m
            - dynamo.trtllm
          env:
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: HF_HOME
              value: /model-cache
            - name: TRITON_CACHE_DIR
              value: /model-cache/.triton-cache
            - name: NCCL_DEBUG
              value: INFO
            - name: NVIDIA_GDRCOPY
              value: "1"
            # InfiniBand/RoCE transport for NCCL + UCX KV transfer
            - name: NCCL_IB_HCA
              value: "mlx5"
            - name: NCCL_IB_GID_INDEX
              value: "3"
            - name: NCCL_IB_TIMEOUT
              value: "22"
            - name: NCCL_SOCKET_IFNAME
              value: eth0
            - name: GLOO_SOCKET_IFNAME
              value: eth0
            - name: UCX_TLS
              value: "rc,cuda_copy,cuda_ipc,gdr_copy"
            - name: UCX_NET_DEVICES
              value: "mlx5_0:1"
            - name: NCCL_STORE_TIMEOUT
              value: "7200"
            - name: TRTLLM_MOE_ENABLE_ALLTOALL_WITHOUT_ALLGATHER
              value: "1"
            - name: TRTLLM_ENABLE_PDL
              value: "1"
            - name: TRTLLM_SERVER_DISABLE_GC
              value: "1"
            - name: TRTLLM_WORKER_DISABLE_GC
              value: "1"
            - name: NCCL_GRAPH_MIXING_SUPPORT
              value: "0"
            - name: TLLM_LOG_LEVEL
              value: "INFO"
          image: nvcr.io/nvidia/ai-dynamo/tensorrtllm-runtime:1.0.0
          name: ""
          resources: {}
          securityContext:
            runAsUser: 0
            capabilities:
              add: ["IPC_LOCK"]
          startupProbe:
            failureThreshold: 60
            httpGet:
              path: /live
              port: 9090
            periodSeconds: 60
            timeoutSeconds: 5
          volumeMounts:
            - mountPath: /model-cache
              name: model-cache
            - mountPath: /config
              name: trtllm-config
              readOnly: true
            - mountPath: /dev/shm
              name: dshm
          workingDir: /workspace/
        volumes:
          - name: model-cache
            persistentVolumeClaim:
              claimName: model-cache
          - name: trtllm-config
            configMap:
              name: dsv32-trtllm-config-b200
          - name: dshm
            emptyDir:
              medium: Memory
              sizeLimit: 80Gi
      replicas: 1
      resources:
        limits:
          gpu: "8"
          rdma/ib: "8"
    dec:
      componentType: worker
      subComponentType: decode
      envFromSecret: hf-token-secret
      extraPodSpec:
        containers: null
        mainContainer:
          args:
            - --model-path
            - nvidia/DeepSeek-V3.2-NVFP4
            - --served-model-name
            - nvidia/DeepSeek-V3.2-NVFP4
            - --extra-engine-args
            - /config/decode.yaml
            - --disaggregation-mode
            - decode
            - --publish-events-and-metrics
            - --request-plane
            - nats
            - --kv-block-size
            - "64"
          command:
            - python3
            - -m
            - dynamo.trtllm
          env:
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: HF_HOME
              value: /model-cache
            - name: TRITON_CACHE_DIR
              value: /model-cache/.triton-cache
            - name: NCCL_DEBUG
              value: INFO
            - name: NVIDIA_GDRCOPY
              value: "1"
            # InfiniBand/RoCE transport for NCCL + UCX KV transfer + EP alltoall
            - name: NCCL_IB_HCA
              value: "mlx5"
            - name: NCCL_IB_GID_INDEX
              value: "3"
            - name: NCCL_IB_TIMEOUT
              value: "22"
            - name: NCCL_SOCKET_IFNAME
              value: eth0
            - name: GLOO_SOCKET_IFNAME
              value: eth0
            - name: UCX_TLS
              value: "rc,cuda_copy,cuda_ipc,gdr_copy"
            - name: UCX_NET_DEVICES
              value: "mlx5_0:1"
            - name: NCCL_STORE_TIMEOUT
              value: "7200"
            - name: TRTLLM_MOE_ENABLE_ALLTOALL_WITHOUT_ALLGATHER
              value: "1"
            - name: TRTLLM_ENABLE_PDL
              value: "1"
            - name: TRTLLM_SERVER_DISABLE_GC
              value: "1"
            - name: TRTLLM_WORKER_DISABLE_GC
              value: "1"
            - name: NCCL_GRAPH_MIXING_SUPPORT
              value: "0"
            - name: ENABLE_CONFIGURABLE_MOE
              value: "1"
            - name: TLLM_LOG_LEVEL
              value: "INFO"
          image: nvcr.io/nvidia/ai-dynamo/tensorrtllm-runtime:1.0.0
          name: ""
          resources: {}
          securityContext:
            runAsUser: 0
            capabilities:
              add: ["IPC_LOCK"]
          startupProbe:
            failureThreshold: 60
            httpGet:
              path: /live
              port: 9090
            periodSeconds: 60
            timeoutSeconds: 5
          volumeMounts:
            - mountPath: /model-cache
              name: model-cache
            - mountPath: /config
              name: trtllm-config
              readOnly: true
            - mountPath: /dev/shm
              name: dshm
          workingDir: /workspace/
        volumes:
          - name: model-cache
            persistentVolumeClaim:
              claimName: model-cache
          - name: trtllm-config
            configMap:
              name: dsv32-trtllm-config-b200
          - name: dshm
            emptyDir:
              medium: Memory
              sizeLimit: 80Gi
      multinode:
        nodeCount: 2
      replicas: 1
      resources:
        limits:
          gpu: "8"
          rdma/ib: "8"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dsv32-trtllm-config-b200
data:
  prefill.yaml: |
    # Prefill: single HGX B200 node, TP=8, EP=8.
    # Small batch size, large max_num_tokens -- minimize TTFT.
    cache_transceiver_config:
      backend: UCX
      max_tokens_in_buffer: 120000
    max_num_tokens: 8192
    enable_chunked_prefill: true
    cuda_graph_config:
      max_batch_size: 32
      enable_padding: true
    disable_overlap_scheduler: true
    enable_attention_dp: true
    kv_cache_config:
      dtype: fp8
      enable_block_reuse: true
      free_gpu_memory_fraction: 0.85
      tokens_per_block: 64
    max_batch_size: 32
    max_seq_len: 121000
    moe_config:
      backend: TRTLLM
    moe_expert_parallel_size: 8
    print_iter_log: true
    tensor_parallel_size: 8
  decode.yaml: |
    # Decode: 2x HGX B200 nodes, TP=16, EP=16 WideEP over InfiniBand.
    # Note: allreduce_strategy intentionally omitted -- MNNVL is GB200-only;
    # default strategy picks NCCL ring/tree over IB which is correct for B200 HGX.
    cache_transceiver_config:
      backend: UCX
      max_tokens_in_buffer: 120000
    max_num_tokens: 8192
    cuda_graph_config:
      max_batch_size: 512
      enable_padding: true
      batch_sizes: [1, 2, 4, 8, 16, 32, 64, 128, 256, 384, 512]
    enable_attention_dp: true
    kv_cache_config:
      dtype: fp8
      enable_block_reuse: false
      free_gpu_memory_fraction: 0.85
      tokens_per_block: 64
    max_batch_size: 512
    max_seq_len: 121000
    moe_config:
      backend: WIDEEP
      use_low_precision_moe_combine: true
    moe_expert_parallel_size: 16
    num_postprocess_workers: 8
    print_iter_log: true
    stream_interval: 10
    tensor_parallel_size: 16
